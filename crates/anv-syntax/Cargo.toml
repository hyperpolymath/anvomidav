[package]
name = "anv-syntax"
version = "0.1.0"
edition = "2021"
description = "Lexer and parser for the Anvomidav figure skating DSL"
license = "MIT OR AGPL-3.0-or-later"
repository = "https://github.com/hyperpolymath/anvomidav"
readme = "README.md"
keywords = ["figure-skating", "dsl", "parser", "lexer"]
categories = ["parsing", "compilers"]

[dependencies]
anv-core = { path = "../anv-core" }
logos = { workspace = true }
chumsky = { workspace = true }
thiserror = { workspace = true }
ordered-float = { workspace = true }

[dev-dependencies]
pretty_assertions = "1.4"
